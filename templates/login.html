<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Faturamento de Academia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="bg-glow"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="login-header">
                <div class="logo-icon">
                    <i data-lucide="check-square" class="icon-accent"></i>
                </div>
                <h2>Faturamento de <span>Academia</span></h2>
                <p>Identificação de CPFs e conciliação de faturamentos</p>
            </div>

            {% for m in get_flashed_messages() %}
            <div class="login-error-alert">
                <i data-lucide="alert-triangle"></i>
                <span>{{ m }}</span>
            </div>
            {% endfor %}

            <form action="{{ url_for('login') }}" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="Digite seu usuário..." required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha..." required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="log-in"></i>
                </button>
            </form>

            <div class="login-footer">
                <p>Controle de Acesso Restrito</p>
                <p style="margin-top: 0.5rem; font-size: 0.8rem; color: var(--text-muted);">
                    Use: <strong>admin</strong> e senha <strong>admin١٢٣</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
